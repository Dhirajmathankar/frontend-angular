<div class="stats-card">
  <div class="card-header">
    <p class="title">{{ title }}</p>
    <h3 class="value">{{ value }}</h3>
  </div>
  <p class="description">{{ description }}</p>
  <!-- Placeholder for the chart -->
  <div class="chart-placeholder">
    <!-- You would integrate a chart library like ng2-charts here -->
  </div>
  <div class="card-footer">
    <div class="footer-item"><strong>10</strong> Open</div>
    <div class="footer-item"><strong>5</strong> Running</div>
    <div class="footer-item"><strong>3</strong> Solved</div>
  </div>
</div>
