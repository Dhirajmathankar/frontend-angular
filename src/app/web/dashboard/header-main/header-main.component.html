<header class="main-header">
  <!-- Left side: Greeting -->
  <div class="header-greeting">
    <h2>{{ greeting }}, {{ userName }}!</h2>
    <p>Welcome back!</p>
  </div>

  <!-- Right side: Search and Stats -->
  <div class="header-actions">
    <div class="search-bar">
      <i-lucide name="search" class="search-icon"></i-lucide>
      <input type="text" placeholder="Search...">
    </div>
    <div class="header-stats">
      <div class="stat-item">
        <p class="stat-label">All Earning</p>
        <p class="stat-value">$30,200 <span class="change positive">+5% change</span></p>
      </div>
      <div class="stat-item">
        <p class="stat-label">Page Views</p>
        <p class="stat-value">290+ <span class="change positive">+5% change</span></p>
      </div>
    </div>
  </div>
</header>
