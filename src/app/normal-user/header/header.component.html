<!-- Navigation -->
<nav class="navbar"
     [class.shrink]="isShrunk"
     [class.nav-hidden]="isHidden">

    <div class="nav-container">

        <!-- Logo -->
        <div class="nav-logo">
            <img loading="lazy"
                 src="./assets/img/memoria-logo/memoria-logo-India.png"
                 alt="Logo">
        </div>

        <!-- Desktop Menu -->
        <div class="nav-menu">

            <div class="nav-item">
                <a href="#home"
                   class="nav-link"
                   [class.active]="activeSection === 'home'">Home</a>
            </div>

            <!-- Venues -->
            <div class="nav-item dropdown"
                 (mouseenter)="openDropdown('venues')"
                 (mouseleave)="closeDropdown()">

                <a href="#venues"
                   class="nav-link"
                   [class.active]="activeSection === 'venues'">Venues</a>

                <div class="dropdown-menu"
                     [class.show]="activeDropdown === 'venues'">
                    <a class="dropdown-item">Hotels</a>
                    <a class="dropdown-item">Lounges</a>
                    <a class="dropdown-item">Marriage Halls</a>
                    <a class="dropdown-item">Outdoor Venues</a>
                </div>
            </div>

            <!-- Photographers -->
            <div class="nav-item dropdown"
                 (mouseenter)="openDropdown('photo')"
                 (mouseleave)="closeDropdown()">

                <a href="#photographers"
                   class="nav-link"
                   [class.active]="activeSection === 'photo'">Photographers</a>

                <div class="dropdown-menu"
                     [class.show]="activeDropdown === 'photo'">
                    <a class="dropdown-item">Wedding Photography</a>
                    <a class="dropdown-item">Pre-Wedding Shoot</a>
                    <a class="dropdown-item">Candid Photography</a>
                    <a class="dropdown-item">Traditional Photography</a>
                </div>
            </div>

            <!-- Resources -->
            <div class="nav-item dropdown"
                 (mouseenter)="openDropdown('resources')"
                 (mouseleave)="closeDropdown()">

                <a href="#blog"
                   class="nav-link"
                   [class.active]="activeSection === 'resources'">Resources</a>

                <div class="dropdown-menu"
                     [class.show]="activeDropdown === 'resources'">
                    <a class="dropdown-item">Festival Guides</a>
                    <a class="dropdown-item">Planning Tips</a>
                    <a class="dropdown-item">Tradition Insights</a>
                    <a class="dropdown-item">Budget Calculators</a>
                </div>
            </div>

            <a href="#contact"
               class="nav-link"
               [class.active]="activeSection === 'contact'">Contact</a>
        </div>

        <!-- Buttons -->
        <div class="nav-buttons">
            <button class="btn-secondary" (click)="userLoginSingUp()">Login</button>
            <button class="btn-primary">Sign Up</button>
        </div>

        <!-- Mobile menu button -->
        <button class="mobile-menu-btn" (click)="mobileOpen = true">
            <i class="fas fa-bars"></i>
        </button>

    </div>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-menu" [class.active]="mobileOpen">
    <button class="close-mobile" (click)="mobileOpen = false">
        <i class="fas fa-times"></i>
    </button>

    <a class="mobile-link" href="#home">Home</a>
    <a class="mobile-link" href="#venues">Venues</a>
    <a class="mobile-link" href="#photographers">Photographers</a>
    <a class="mobile-link" href="#blog">Resources</a>
    <a class="mobile-link" href="#contact">Contact</a>

    <button class="btn-secondary mt">Login</button>
    <button class="btn-primary mt">Sign Up</button>
</div>
